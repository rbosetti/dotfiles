[bell]
animation = "EaseOutExpo"
duration = 0

[colors]
draw_bold_text_with_bright_colors = true

[cursor]
style = "Block"
unfocused_hollow = false

[env]
TERM = "xterm-256color"

[font]
size = 11.0

[font.normal]
family = "Ubuntu Mono"

[font.offset]
x = 0
y = 0

[[hints.enabled]]
command = "xdg-open"
hyperlinks = true
post_processing = true
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini:|gopher:|https:|http:|news:|file:|git:|ssh:|ftp:)[^\u0000-\u001F\u007F-<>\"\\s{-}\\^⟨⟩`]+"

[hints.enabled.binding]
key = "U"
mods = "Control|Shift"

[hints.enabled.mouse]
enabled = true
mods = "None"

[mouse]
hide_when_typing = true

[[mouse.bindings]]
action = "PasteSelection"
mouse = "Middle"

[scrolling]
history = 10000
multiplier = 3

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>"

[terminal.shell]
args = ["--login"]
program = "/bin/zsh"

[window]
decorations = "Full"
dynamic_padding = false
dynamic_title = true
opacity = 1.0
option_as_alt = "Both"
resize_increments = true

[window.dimensions]
columns = 162
lines = 70

[window.padding]
x = 2
y = 2

[general]
live_config_reload = true
import = ["/Users/rlb/.config/alacritty/keybindings.toml", "/Users/rlb/.config/alacritty/darktheme.toml"]
